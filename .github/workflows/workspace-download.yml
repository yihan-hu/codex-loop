name: Workspace Download

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build source archive
        run: |
          git archive \
            --format=tar.gz \
            --output=/tmp/codex-loop-source.tar.gz \
            HEAD
          sha256sum /tmp/codex-loop-source.tar.gz

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-loop-source
          path: /tmp/codex-loop-source.tar.gz
          if-no-files-found: error
          retention-days: 1
