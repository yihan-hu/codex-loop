name: Codex Loop Broad Invocation Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/codex-loop-broad-invocation.ready'

permissions:
  contents: write

concurrency:
  group: codex-loop-broad-invocation-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/codex-loop-broad-invocation.ready
          git merge-base --is-ancestor 5bd07bb3eee55afb561bd21f21005c1d2f1fc30b HEAD
          cat .github/codex-loop-broad-invocation.patch.part00 \
              .github/codex-loop-broad-invocation.patch.part01 \
              .github/codex-loop-broad-invocation.patch.part02 > /tmp/upgrade.patch
          test "$(stat -c%s /tmp/upgrade.patch)" = "20848"
          echo "cb7733ac5822f9ca291ca649b528759a199c1c89cb790cb8541951d2a8c9e8f6  /tmp/upgrade.patch" | sha256sum -c -
          git apply --check /tmp/upgrade.patch

      - name: Apply patch and run targeted regression
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/upgrade.patch
          python3 -B -m unittest tests.compat.test_lifecycle tests.compat.test_invocation_contract

      - name: Commit verified source and clean transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/source-export-20260829.request
          rm -f .github/codex-loop-broad-invocation.ready
          rm -f .github/codex-loop-broad-invocation.patch.part00
          rm -f .github/codex-loop-broad-invocation.patch.part01
          rm -f .github/codex-loop-broad-invocation.patch.part02
          rm -f .github/workflows/codex-loop-broad-invocation-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Broaden Codex Loop invocation across domains"
          git push origin HEAD:main
