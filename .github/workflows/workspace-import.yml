name: Workspace Import

on:
  push:
    paths:
      - '.github/import-requests/*.json'

permissions:
  contents: write

concurrency:
  group: workspace-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact-identity request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '.github/import-requests/*.json')
          test "${#files[@]}" -eq 1
          req="${files[0]}"
          echo "request=$req" >> "$GITHUB_OUTPUT"
          jq -e '.version == 2
            and (.transfer_id | type == "string" and length > 0)
            and (.bundle_file_id | type == "string" and length > 0)
            and (.bundle_size | type == "number" and . > 0)
            and (.bundle_sha256 | type == "string")
            and (.bundle_ref | type == "string")
            and (.expected_base | type == "string")
            and (.target_branch | type == "string" and length > 0)
            and (.source_commit | type == "string")
            and (.source_tree | type == "string")' "$req" >/dev/null
          bundle_sha="$(jq -r .bundle_sha256 "$req")"
          bundle_ref="$(jq -r .bundle_ref "$req")"
          base="$(jq -r .expected_base "$req")"
          source_commit="$(jq -r .source_commit "$req")"
          source_tree="$(jq -r .source_tree "$req")"
          [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$bundle_ref" =~ ^refs/heads/codex-loop-publish-[0-9a-f]{32}$ ]]
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          test "$base" = "${{ github.event.before }}"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$base"
          test "$(jq -r .target_branch "$req")" = "${{ github.ref_name }}"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          [[ "${changed[0]}" == A$'\t'.github/import-requests/* ]]
          cp "$req" /tmp/workspace-import-request.json

      - name: Download and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          req='${{ steps.request.outputs.request }}'
          file_id="$(jq -r .bundle_file_id "$req")"
          expected_size="$(jq -r .bundle_size "$req")"
          expected_sha="$(jq -r .bundle_sha256 "$req")"
          curl -fL --retry 3 --retry-all-errors \
            "https://drive.usercontent.google.com/download?id=${file_id}&export=download&confirm=t" \
            -o /tmp/source.bundle
          test "$(stat -c %s /tmp/source.bundle)" = "$expected_size"
          echo "$expected_sha  /tmp/source.bundle" | sha256sum -c -
          git bundle verify /tmp/source.bundle

      - name: Verify audited Git identity and ancestry
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          req=/tmp/workspace-import-request.json
          bundle_ref="$(jq -r .bundle_ref "$req")"
          source_commit="$(jq -r .source_commit "$req")"
          source_tree="$(jq -r .source_tree "$req")"
          expected_base="$(jq -r .expected_base "$req")"
          git fetch /tmp/source.bundle "$bundle_ref:refs/codex-loop/publish"
          test "$(git rev-parse refs/codex-loop/publish)" = "$source_commit"
          test "$(git rev-parse "$source_commit^{tree}")" = "$source_tree"
          git merge-base --is-ancestor "$expected_base" "$source_commit"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Publish exact audited commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          req=/tmp/workspace-import-request.json
          source_commit='${{ steps.verify.outputs.commit }}'
          source_tree='${{ steps.verify.outputs.tree }}'
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push \
            --force-with-lease="refs/heads/$GITHUB_REF_NAME:$GITHUB_SHA" \
            origin "$source_commit:refs/heads/$GITHUB_REF_NAME"
          published_commit="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$published_commit" = "$source_commit"
          test "$(git rev-parse "$published_commit^{tree}")" = "$source_tree"
          echo "commit=$published_commit" >> "$GITHUB_OUTPUT"
          echo "tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Build and fresh-restore published acquisition bundle
        id: published_source
        shell: bash
        run: |
          set -euo pipefail
          published_commit='${{ steps.publish.outputs.commit }}'
          published_tree='${{ steps.publish.outputs.tree }}'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          export_ref='refs/heads/codex-loop-published-export'
          git update-ref "$export_ref" "$published_commit"
          git bundle create /tmp/published-source.bundle "$export_ref"
          git update-ref -d "$export_ref"
          source_sha256="$(sha256sum /tmp/published-source.bundle | awk '{print $1}')"
          source_size="$(stat -c %s /tmp/published-source.bundle)"
          restore_root="$(mktemp -d)"
          git clone -q /tmp/published-source.bundle "$restore_root/repo"
          git -C "$restore_root/repo" checkout -q --detach "$published_commit"
          test "$(git -C "$restore_root/repo" rev-parse HEAD)" = "$published_commit"
          test "$(git -C "$restore_root/repo" rev-parse 'HEAD^{tree}')" = "$published_tree"
          rm -rf "$restore_root"
          echo "sha256=$source_sha256" >> "$GITHUB_OUTPUT"
          echo "size=$source_size" >> "$GITHUB_OUTPUT"
          echo "published source commit=$published_commit tree=$published_tree size=$source_size sha256=$source_sha256 fresh_restore=PASS"

      - name: Upload published source bundle
        id: published_upload
        uses: actions/upload-artifact@v4
        with:
          name: published-source-${{ github.run_id }}
          path: /tmp/published-source.bundle
          if-no-files-found: error
          retention-days: 90

      - name: Write receipt
        shell: bash
        run: |
          set -euo pipefail
          req=/tmp/workspace-import-request.json
          jq -n \
            --arg transfer_id "$(jq -r .transfer_id "$req")" \
            --arg trigger "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg bundle_sha256 "$(jq -r .bundle_sha256 "$req")" \
            --argjson bundle_size "$(jq -r .bundle_size "$req")" \
            --arg bundle_ref "$(jq -r .bundle_ref "$req")" \
            --arg published_commit '${{ steps.publish.outputs.commit }}' \
            --arg published_tree '${{ steps.publish.outputs.tree }}' \
            --arg published_source_sha256 '${{ steps.published_source.outputs.sha256 }}' \
            --argjson published_source_size '${{ steps.published_source.outputs.size }}' \
            --arg published_source_artifact 'published-source-${{ github.run_id }}' \
            --arg published_source_artifact_id '${{ steps.published_upload.outputs.artifact-id }}' \
            '{version:3,transfer_id:$transfer_id,trigger_sha:$trigger,target_branch:$branch,bundle_sha256:$bundle_sha256,bundle_size:$bundle_size,bundle_ref:$bundle_ref,published_commit:$published_commit,published_tree:$published_tree,published_source_sha256:$published_source_sha256,published_source_size:$published_source_size,published_source_artifact:$published_source_artifact,published_source_artifact_id:$published_source_artifact_id,fresh_restore:"PASS"}' \
            > /tmp/workspace-import-receipt.json
          cat /tmp/workspace-import-receipt.json

      - name: Upload receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-import-receipt-${{ github.run_id }}
          path: /tmp/workspace-import-receipt.json
          if-no-files-found: error
          retention-days: 90
